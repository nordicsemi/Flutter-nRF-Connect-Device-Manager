import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'com.android.library'
    id 'com.squareup.wire'
}

group 'no.nordicsemi.android.mcumgr_flutter'
version '1.0-SNAPSHOT'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

android {
    namespace = 'no.nordicsemi.android.mcumgr_flutter'
    compileSdk = 37

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdk = 21
        targetSdk = 37
    }
    lint {
        disable += 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
}

kotlin {
    compilerOptions {
        jvmTarget = JvmTarget.JVM_21
    }
}

wire {
    sourcePath {
        srcDir '../lib/proto'
    }
    kotlin {}
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'no.nordicsemi.android:mcumgr-ble:3.4.1'

    // Keep protobuf-lite below 4.34 to avoid DescriptorProtos duplication with
    // Firebase's protolite-well-known-types in host apps.
    // See: https://github.com/nordicsemi/Flutter-nRF-Connect-Device-Manager/issues/152
    implementation 'com.google.protobuf:protobuf-kotlin-lite:3.25.9'

    implementation 'com.fasterxml.jackson.core:jackson-core:2.21.3'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.22'
}
