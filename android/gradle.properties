org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
# Kept off: AGP 9.4.1's built-in Kotlin bundles a fixed ~2.2.x compiler, which
# can't read the Kotlin 2.4 metadata produced by our own dependency
# no.nordicsemi.android:mcumgr-ble:3.4.1. Applying the classic Kotlin Gradle
# Plugin here guarantees consumers get a modern enough compiler regardless of
# their own built-in-Kotlin status.
android.builtInKotlin=false
