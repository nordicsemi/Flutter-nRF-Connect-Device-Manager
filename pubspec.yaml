name: mcumgr_flutter
description: nRF Connect Device Manager library is a Flutter plugin based on
  Android, iOS and MacOS nRF Connect Device Manager libraries.
version: 0.9.1
homepage: 'https://github.com/nordicsemi/Flutter-nRF-Connect-Device-Manager'

environment:
  sdk: ^3.8.0
  flutter: '>=3.7.2'

dependencies:
  fixnum: ^1.1.1
  flutter:
    sdk: flutter
  protobuf: ^5.1.0
  rxdart: ^0.28.0
  archive: ^4.0.9
  web: ^1.1.0

dev_dependencies:
  faker: ^2.1.0
  flutter_test:
    sdk: flutter
  pigeon: ^27.0.0

flutter:
  plugin:
    platforms:
      android:
        package: no.nordicsemi.android.mcumgr_flutter
        pluginClass: McumgrFlutterPlugin
      ios:
        pluginClass: McumgrFlutterPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: McumgrFlutterPlugin
        sharedDarwinSource: true

  assets:
    - assets/mock_logs.txt
    - lib/src/mcumgr_web/mcumgr_setup.js
    - lib/src/mcumgr_web/mcumgr_interop.js
    - lib/src/mcumgr_web/mcumgr.js
    - lib/src/mcumgr_web/cbor.js
