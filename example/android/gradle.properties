org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
# Kept off: AGP 9.2.1's built-in Kotlin bundles a fixed ~2.2.x compiler, which
# can't read the Kotlin 2.4 metadata produced by our own dependency
# no.nordicsemi.android:mcumgr-ble:2.9.0 (verified via `gradlew :app:dependencyInsight
# --dependency org.jetbrains.kotlin:kotlin-stdlib`). This is unrelated to whether
# other Flutter plugins have migrated to built-in Kotlin - it's a version ceiling
# in AGP's bundled compiler itself. Keeping the classic Kotlin Gradle Plugin here
# (2.4.20) makes Gradle's shared Kotlin compiler daemon use a modern-enough
# compiler for the whole build, including the mcumgr_flutter plugin module, which
# itself has android.builtInKotlin=true and works only because of this.
android.builtInKotlin=false
android.newDsl=false
